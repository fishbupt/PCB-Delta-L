[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "pcb-delta-l"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-rf>=1.0", "matplotlib>=3.7", "PyQt6>=6.5"]
[project.optional-dependencies]
test = ["pytest>=7"]
[project.scripts]
pcb-delta-l = "pcb_delta_l.gui:main"
[tool.setuptools.packages.find]
include = ["pcb_delta_l*"]
